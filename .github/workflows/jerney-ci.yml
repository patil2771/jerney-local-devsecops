name: Jerney CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  lint-and-build:
    name: Lint and Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Run lint
        working-directory: ${{ matrix.component }}
        run: npm run lint

      - name: Build application
        working-directory: ${{ matrix.component }}
        run: npm run build --if-present


  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: lint-and-build

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.component }}
        run: npm ci

      - name: Audit dependencies
        working-directory: ${{ matrix.component }}
        run: npm audit --audit-level=high


  helm-validation:
    name: Helm Validation
    runs-on: ubuntu-latest
    needs: [lint-and-build, dependency-audit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint Helm chart
        run: helm lint helm/jerney

      - name: Render Helm templates
        run: |
          helm template jerney-test ./helm/jerney \
            -n jerney-helm \
            --set ingress.enabled=false \
            > rendered.yaml

      - name: Verify rendered manifests
        run: |
          grep "^kind:" rendered.yaml
          grep -E "image:|POSTGRES_|storage:" rendered.yaml


  docker-build:
    name: Build, Scan and Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-build, dependency-audit, helm-validation]

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        component: [backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:sha-${{ github.sha }}
          version: v0.72.0
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:sha-${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/jerney-${{ matrix.component }}:latest
