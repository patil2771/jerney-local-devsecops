backend:
  replicaCount: 1
  image:
    repository: jerney-backend
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 5000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

frontend:
  replicaCount: 1
  image:
    repository: jerney-frontend
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: "16"
  service:
    port: 5432
  storage:
    size: 1Gi

secret:
  existingSecret: postgres-secret